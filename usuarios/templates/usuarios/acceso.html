{% extends "usuarios/base.html" %}

{% block titulo %}Iniciar sesión - Verdeazul Carbono{% endblock %}

{% block contenido %}
  <h1>Iniciar sesión</h1>
  {% if error %}
    <p role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{% url 'acceso' %}">
    {% csrf_token %}
    <p>
      <label for="{{ form.correo.id_for_label }}">{{ form.correo.label }}</label><br>
      {{ form.correo }}
    </p>
    <p>
      <label for="{{ form.password.id_for_label }}">{{ form.password.label }}</label><br>
      {{ form.password }}
    </p>
    <p><button type="submit">Continuar</button></p>
  </form>
{% endblock %}
