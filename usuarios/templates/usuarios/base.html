{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f2">
  <title>{% block titulo %}Verdeazul Carbono{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'usuarios/app.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% if user.is_authenticated %}{% url 'cuenta' %}{% else %}{% url 'acceso' %}{% endif %}" aria-label="Verdeazul Carbono, inicio">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span class="brand-name">Verdeazul <strong>Carbono</strong></span>
    </a>
    <nav class="site-nav" aria-label="Navegación principal">
      {% if user.is_authenticated %}
        <a href="{% url 'cuenta' %}" {% if request.resolver_match.url_name == 'cuenta' %}aria-current="page"{% endif %}>Mi cuenta</a>
      {% else %}
        <a href="{% url 'acceso' %}" {% if request.resolver_match.url_name == 'acceso' or request.resolver_match.url_name == 'segundo_factor' %}aria-current="page"{% endif %}>Acceso</a>
      {% endif %}
      <a href="{% url 'verificar' %}" {% if request.resolver_match.url_name == 'verificar' %}aria-current="page"{% endif %}>Verificar certificado</a>
    </nav>
  </header>
  <main class="site-main {% block main_class %}{% endblock %}">
    {% block contenido %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>Verdeazul Carbono</span>
    <span>Registro y verificación de mediciones</span>
  </footer>
</body>
</html>
